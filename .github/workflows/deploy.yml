name: Deploy to Aliyun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_KEY }}
          source: "."
          target: "/www/wwwroot/fufangtools"
          # 排除不需要上传的开发文件
          rm: false
          exclude: ".git,.github,.gitignore,node_modules,dist"

      - name: Install dependencies and restart server
        uses: appleboy/ssh-action@master
        env:
          ICP_NUMBER: ${{ secrets.ICP_NUMBER }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_KEY }}
          envs: ICP_NUMBER
          script: |
            # 进入项目目录
            cd /www/wwwroot/fufangtools
            
            # 安装依赖
            npm install --production
            
            # 设置环境变量
            export NODE_ENV=production
            # 这里的 $ICP_NUMBER 来自于上面的 envs 配置
            export ICP_NUMBER=$ICP_NUMBER
            
            # 使用 PM2 重启或启动服务
            # --update-env 确保 PM2 更新进程的环境变量
            if pm2 list | grep -q "fufangtools"; then
              pm2 reload fufangtools --update-env
            else
              pm2 start server.js --name fufangtools
            fi
            
            pm2 save
