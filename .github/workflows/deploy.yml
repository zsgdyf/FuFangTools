name: Deploy to Aliyun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 安装依赖并构建 Vue 应用
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # 上传构建产物和服务端文件到阿里云
      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          port: 51208
          key: ${{ secrets.ALIYUN_KEY }}
          # 仅上传生产环境所需的文件
          source: "dist/,server/,landing_page/,functions/,package.json,package-lock.json"
          target: "/www/wwwroot/fufangtools"
          rm: false

      # 在服务器上安装生产依赖并重启服务
      - name: Install dependencies and restart server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ICP_NUMBER: ${{ secrets.ICP_NUMBER }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          port: 51208
          key: ${{ secrets.ALIYUN_KEY }}
          envs: ICP_NUMBER
          script: |
            # 进入项目目录
            cd /www/wwwroot/fufangtools

            # 仅安装生产依赖（express 等），--omit=dev 为 npm v7+ 推荐写法
            npm install --omit=dev

            # 使用 PM2 重启或启动服务
            # --update-env 确保 PM2 更新进程的环境变量
            # 首次启动时显式传入环境变量，避免服务器重启后丢失
            if pm2 list | grep -q "fufangtools"; then
              NODE_ENV=production ICP_NUMBER=$ICP_NUMBER pm2 reload fufangtools --update-env
            else
              NODE_ENV=production ICP_NUMBER=$ICP_NUMBER pm2 start server/server.js --name fufangtools
            fi

            pm2 save
