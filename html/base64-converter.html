<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Base64 编码转换 - 浮方工具箱</title>
        <link rel="icon" href="../assets/favicon.ico" sizes="any">
        <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="../assets/favicon-96x96.png">
        <link rel="stylesheet" href="../css/theme.css">
        <link rel="stylesheet" href="../css/tool-common.css">
        <link rel="stylesheet" href="../css/base64-converter.css">
    </head>

    <body>

        <div class="container container-wide">
            <a href="../index.html" class="back-link">← 返回工具箱</a>
            <header>
                <h1>Base64 编码转换</h1>
                <p class="desc">在线文本 Base64 加密与解密工具</p>
            </header>

            <div class="converter-wrapper">
                <div class="input-section">
                    <label for="normalText">普通文本</label>
                    <textarea class="tool-input text-area" id="normalText" placeholder="在此输入要编码的内容..."></textarea>
                </div>

                <div class="controls-section">
                    <button class="btn-calc btn-action" onclick="encodeBase64()">Base64 编码 &rarr;</button>
                    <button class="btn-calc btn-action" onclick="decodeBase64()">&larr; Base64 解码</button>
                    <button class="btn-clear btn-action" onclick="clearAll()">清空 ↺</button>
                </div>

                <div class="input-section">
                    <label for="base64Text">Base64 编码</label>
                    <textarea class="tool-input text-area" id="base64Text" placeholder="在此输入 Base64 字符串..."></textarea>
                </div>
            </div>

        </div>

        <script src="../js/base64-converter.js"></script>
    </body>

</html>
