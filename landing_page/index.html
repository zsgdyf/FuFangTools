<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮方工具箱 - 主页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f8fafc;
            color: #334155;
        }
        .content {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #1e293b;
        }
        p {
            font-size: 1.1rem;
            color: #64748b;
        }
        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        footer {
            width: 100%;
            text-align: center;
            padding: 20px 0;
            font-size: 12px;
            color: #94a3b8;
            background-color: #f1f5f9;
        }
        footer a {
            color: inherit;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        .police-box {
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>欢迎访问</h1>
        <p>本站正在运行中，请访问子域名使用应用服务。</p>
        <!-- 如果你想在这个页面放置进入系统的按钮，可以取消下面的注释，并将 href 修改为你的子域名 -->
        <!-- <a href="http://app.yourdomain.com" class="btn">进入系统</a> -->
    </div>

    <footer>
        <div>
            <!-- 请将下面的文本替换为您的真实ICP备案号 -->
            <a href="https://beian.miit.gov.cn/" target="_blank">鄂ICP备XXXXXXXX号</a>
        </div>
        <div class="police-box">
            <!-- 假设备案图标也放在这个静态目录中，部署时记得复制图片文件到同级目录 -->
            <img src="备案图标.png" style="width: 20px; height: 20px;" alt="警徽">
            <a href="https://beian.mps.gov.cn/#/query/webSearch?code=42010302002809" rel="noreferrer" target="_blank">鄂公网安备42010302002809号</a>
        </div>
    </footer>
</body>
</html>
